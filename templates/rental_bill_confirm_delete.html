{% extends "dashboard/layout/dashboardLayout.html" %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 px-4">
        <div class="bg-white rounded-xl shadow p-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Delete Rental Bill?</h1>

                <p class="text-gray-600 mb-6">
                        Are you sure you want to delete
                        <strong>{{ object.property.property_name }} - {{ object.bill_month|date:"F Y" }}</strong>?
                </p>

                <form method="post" class="flex justify-end gap-3">
                        {% csrf_token %}

                        <a href="{% url 'accounts:rental_bill_detail' object.pk %}"
                                class="px-5 py-2 rounded-lg bg-gray-100 text-gray-700 font-semibold">
                                Cancel
                        </a>

                        <button type="submit" class="px-5 py-2 rounded-lg bg-red-600 text-white font-semibold">
                                Delete
                        </button>
                </form>
        </div>
</div>
{% endblock %}
